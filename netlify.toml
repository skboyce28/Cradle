# Netlify builds Cradle from this repo: runs the build script and publishes pwa/
# Set CRADLE_SUPABASE_URL and CRADLE_SUPABASE_KEY under Site configuration > Environment variables.
# Optional: CRADLE_DONATE_URL shows a "Buy me a coffee" button (an https:// link).
[build]
  command = "python3 build_pwa.py"
  publish = "pwa"
  # Only deploy commits whose tests passed: skips Git-triggered builds until GitHub Actions'
  # "test" job succeeds, then the workflow's deploy job starts the build through a build hook.
  ignore = "python3 ./tools/netlify_ignore.py"

# Security and cache headers are written to pwa/_headers by build_pwa.py.
